syntax = "proto3";

package vectorstore.v1;

option go_package = "github.com/gangantongxue/GanRAG/api/gen/vector-store/v1;vectorstorev1";

// VectorStore 向量存储服务
//
// 提供集合（索引）管理、向量写入、相似度检索、向量删除和元数据查询能力。
// 嵌入向量（embedding）由调用方生成并传入，本服务不负责调用外部向量化模型。
service VectorStore {
  // CreateCollection 创建集合（对应 chromem 的 Collection，即索引）
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);

  // DeleteCollection 删除集合及其全部文档
  rpc DeleteCollection(DeleteCollectionRequest) returns (DeleteCollectionResponse);

  // ListCollections 列出所有集合及文档数量
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);

  // Write 批量写入文档（按 ID upsert，同 ID 覆盖旧文档）
  rpc Write(WriteRequest) returns (WriteResponse);

  // Search 传入查询向量，返回相似度最高的 top_k 个文档
  rpc Search(SearchRequest) returns (SearchResponse);

  // Delete 按文档 ID 或过滤条件删除文档
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // GetByID 按文档 ID 查询单个文档
  rpc GetByID(GetByIDRequest) returns (GetByIDResponse);
}

// Document 向量文档
message Document {
  // 文档唯一 ID（必填，同一集合内唯一）
  string id = 1;
  // 嵌入向量（必填，同一集合内所有文档维度必须一致）
  repeated float embedding = 2;
  // 原始文本内容（可选，用于检索结果返回与文档内容过滤）
  string content = 3;
  // 元数据（可选，用于检索时的元数据过滤）
  map<string, string> metadata = 4;
}

// Collection 集合信息
message Collection {
  // 集合名称
  string name = 1;
  // 集合内文档数量
  int64 count = 2;
}

// CreateCollectionRequest 创建集合请求
message CreateCollectionRequest {
  // 集合名称（必填）
  string name = 1;
  // 集合元数据（可选）
  map<string, string> metadata = 2;
}

// CreateCollectionResponse 创建集合响应
message CreateCollectionResponse {}

// DeleteCollectionRequest 删除集合请求
message DeleteCollectionRequest {
  // 集合名称（必填）
  string name = 1;
}

// DeleteCollectionResponse 删除集合响应
message DeleteCollectionResponse {}

// ListCollectionsRequest 列出集合请求
message ListCollectionsRequest {}

// ListCollectionsResponse 列出集合响应
message ListCollectionsResponse {
  // 集合列表
  repeated Collection collections = 1;
}

// WriteRequest 批量写入请求
message WriteRequest {
  // 目标集合名称（必填）
  string collection = 1;
  // 待写入文档列表（必填，不能为空）
  repeated Document documents = 2;
  // 集合不存在时是否自动创建（false 时返回 NotFound）
  bool create_if_missing = 3;
}

// WriteResponse 批量写入响应
message WriteResponse {
  // 成功写入的文档数量
  int64 written = 1;
}

// SearchRequest 相似度检索请求
message SearchRequest {
  // 目标集合名称（必填）
  string collection = 1;
  // 查询向量（必填，维度需与集合内文档一致）
  repeated float query_embedding = 2;
  // 返回结果数量上限（必填，>=1；超过集合文档数时按实际数量返回）
  int32 top_k = 3;
  // 元数据精确匹配过滤（可选，如 {"source": "notion"}）
  map<string, string> where = 4;
  // 文档内容过滤（可选，支持 $contains / $not_contains）
  map<string, string> where_document = 5;
}

// SearchResult 单条检索结果
message SearchResult {
  // 文档 ID
  string id = 1;
  // 文档原始内容
  string content = 2;
  // 文档元数据
  map<string, string> metadata = 3;
  // 与查询向量的余弦相似度，范围 [-1, 1]，越大越相似
  float similarity = 4;
}

// SearchResponse 相似度检索响应
message SearchResponse {
  // 检索结果，按相似度降序排列
  repeated SearchResult results = 1;
}

// DeleteRequest 删除文档请求
message DeleteRequest {
  // 目标集合名称（必填）
  string collection = 1;
  // 待删除文档 ID 列表；与 where / where_document 至少填一项
  repeated string ids = 2;
  // 元数据精确匹配过滤（可选）
  map<string, string> where = 3;
  // 文档内容过滤（可选，支持 $contains / $not_contains）
  map<string, string> where_document = 4;
}

// DeleteResponse 删除文档响应
message DeleteResponse {}

// GetByIDRequest 按 ID 查询请求
message GetByIDRequest {
  // 目标集合名称（必填）
  string collection = 1;
  // 文档 ID（必填）
  string id = 2;
}

// GetByIDResponse 按 ID 查询响应
message GetByIDResponse {
  // 查询到的文档
  Document document = 1;
}
