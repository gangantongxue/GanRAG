syntax = "proto3";

package user.v1;

option go_package = "github.com/gangantongxue/GanRAG/api/gen/user/v1;userv1";

// UserService 服务：账号生命周期管理
//
// 提供注册（邮箱+验证码）、登录（邮箱+密码，双 token 签发）、refresh token 轮换、
// 用户信息查询与修改密码。access token 的校验由 Gateway 负责（本地验签，不回源本服务）。
// 对外标识一律 xid 全串（pkg/eid，如 usr_<xid>），数据库自增 id 不出服务
// （对齐根 AGENTS.md「业务主键（XID）规范」）。
// 注：架构文档草案中 service 与 message 同名为 User，proto3 禁止，service 更名为 UserService。
service UserService {
  // SendEmailCode 发送邮箱验证码（register / reset_password；验证码存 Redis，SMTP 下发）
  rpc SendEmailCode(SendEmailCodeRequest) returns (SendEmailCodeResponse);
  // Register 用户注册（邮箱唯一，密码 bcrypt 哈希存储，需邮箱验证码）
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Login 用户登录（邮箱+密码校验凭证，签发 access + refresh 双 token）
  rpc Login(LoginRequest) returns (LoginResponse);
  // Refresh 轮换 token 对（sessions.token_hash 原地更新；旧 token 复用按无效拒绝）
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  // GetUser 按 xid 查询用户信息（供 Gateway / 其他服务调用）
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // UpdatePassword 修改密码（校验旧密码，成功后删除该用户全部 sessions）
  rpc UpdatePassword(UpdatePasswordRequest) returns (UpdatePasswordResponse);
}

message User {
  string xid = 1;        // 业务主键 usr_<xid> 全串（对外唯一标识）
  string email = 2;      // 登录标识（唯一）
  string username = 3;   // 展示名，可重复、可为空
  int32  status = 4;     // 1 正常 0 禁用
  int64  created_at_unix = 5;  // 创建时间（Unix 秒）
  int64  updated_at_unix = 6;  // 更新时间（Unix 秒）
}

message SendEmailCodeRequest {
  string email = 1;      // 目标邮箱
  string scene = 2;      // 场景：register | reset_password
}
// SendEmailCodeResponse 防枚举：不回传验证码是否发出等细节
message SendEmailCodeResponse {}

message RegisterRequest {
  string email = 1;      // 邮箱（唯一）
  string code = 2;       // 邮箱验证码（scene=register）
  string password = 3;   // 8-64 字符
  string username = 4;   // 展示名，可选（≤64 字符）
}
// RegisterResponse 注册成功不返回 token，前端随后走登录
message RegisterResponse {
  User user = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string device_id = 3;    // 设备码（可选；合法则沿用，否则服务端生成，口径见 docs/data-model.md「设备标识（device_id）口径」）
  string device_info = 4;  // 设备信息（可选；前端展示名，缺省由 Gateway 取 User-Agent 截断 255）
}
message LoginResponse {
  User   user = 1;
  string access_token = 2;   // JWT，15 分钟
  string refresh_token = 3;  // 不透明串，7 天
  int64  access_expires_in = 4;   // access 有效期（秒）
  int64  refresh_expires_in = 5;  // refresh 有效期（秒）
  string device_id = 6;      // 回填：本次生效的设备码（前端存 localStorage，Gateway 设 `did` cookie）
}

message RefreshRequest {
  string refresh_token = 1;
}
message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64  access_expires_in = 3;
  int64  refresh_expires_in = 4;
}

message GetUserRequest {
  string xid = 1;        // 用户业务主键 usr_<xid> 全串
}
message GetUserResponse {
  User user = 1;
}

message UpdatePasswordRequest {
  string user_xid = 1;   // 由 Gateway 从 access token 解析后注入，不信任请求体
  string old_password = 2;
  string new_password = 3; // 8-64 字符
}
message UpdatePasswordResponse {}
