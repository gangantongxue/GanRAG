version: '3'

# GanRAG 根 Taskfile：统一编排各服务的编译、镜像构建与容器运行
#
# 常用命令：
#   task proto                     生成所有服务的 Proto Go 代码
#   task build                     编译所有已实现服务
#   task build -- vector-store     只编译指定服务
#   task build-image               构建所有已实现服务的镜像
#   task run                       后台启动所有已实现服务
#   task run -- vector-store       前台启动指定服务
#   task stop                      停止所有服务容器
#   task ds-check                  数据集融合脚本自检（假数据 + mock 模型）
#   task ds-smoke                  数据集融合真模型冒烟（ds-run 前必过）
#   task ds-run                    数据集融合闭环：开始/续跑（ROUNDS=10 分批）
#   task ds-status                 查看数据集融合调参进度
#   task ds-archive-v1             v1 核心产物归档（一次性；之后版本自动隔离）
#   task ds-embed                  BM25 + 向量 + 精确 top-K（长任务，可分批/续跑）
#   task ds-build-tuning           构建 neutral/joint 调参数据
#   task ds-tune                   联合扫描召回参数（NDCG@10 / Recall@20）

# 服务列表：自动发现 service/<name>/Taskfile.yml 并按名称排序
vars:
  SERVICES:
    sh: find service -mindepth 2 -maxdepth 2 -name Taskfile.yml -exec dirname {} \; | xargs -n1 basename | sort
  # 数据集融合每批次轮数（task ds-run ROUNDS=5 覆盖；命令行变量优先于此处默认值）
  ROUNDS: "10"
  # v3 融合复用 v2 引擎；该 venv 内安装 numpy（向量链路使用）
  DS_PYTHON: "datasets/.venv/bin/python"

tasks:
  default:
    desc: 列出所有可用任务
    cmds:
      - task --list

  proto:
    desc: 生成所有服务的 Proto Go 代码（api/gen）
    cmds:
      - ./scripts/gen-proto.sh

  build:
    desc: 编译服务（全部；指定单个：task build -- vector-store）
    cmds:
      - cmd: |
          set -e
          if [ -n "{{.CLI_ARGS}}" ]; then
            set -- {{.CLI_ARGS}}
            task -d "service/$1" build
            exit 0
          fi
          for tf in service/*/Taskfile.yml; do
            [ -e "$tf" ] || continue
            svc="$(basename "$(dirname "$tf")")"
            echo "==> build ${svc}"
            task -d "service/${svc}" build
          done

  build-image:
    desc: 构建服务镜像（全部；指定单个：task build-image -- vector-store）
    cmds:
      - cmd: |
          set -e
          if [ -n "{{.CLI_ARGS}}" ]; then
            set -- {{.CLI_ARGS}}
            task -d "service/$1" build-image
            exit 0
          fi
          for tf in service/*/Taskfile.yml; do
            [ -e "$tf" ] || continue
            svc="$(basename "$(dirname "$tf")")"
            echo "==> build-image ${svc}"
            task -d "service/${svc}" build-image
          done

  run:
    desc: 启动服务（全部后台运行；指定单个：task run -- vector-store [--detach]）
    cmds:
      - cmd: |
          set -e
          if [ -n "{{.CLI_ARGS}}" ]; then
            set -- {{.CLI_ARGS}}
            svc="$1"
            shift
            task -d "service/${svc}" run -- "$@"
            exit 0
          fi
          for tf in service/*/Taskfile.yml; do
            [ -e "$tf" ] || continue
            svc="$(basename "$(dirname "$tf")")"
            echo "==> run ${svc}"
            task -d "service/${svc}" run -- --detach
          done
          echo "全部已实现服务已后台启动（日志：docker logs -f ganrag-<服务名>；停止：task stop）"

  stop:
    desc: 停止并删除所有服务容器
    cmds:
      - for: { var: SERVICES }
        cmd: task -d "service/{{.ITEM}}" stop

  infra:
    desc: 启动共享基础设施（MySQL、Garage；数据卷持久化）
    cmds:
      # ganrag 网络为外部共享（compose 与各服务 run.sh 共用），不存在时先创建
      - docker network inspect ganrag >/dev/null 2>&1 || docker network create ganrag
      - docker compose up -d

  infra-down:
    desc: 停止共享基础设施（数据卷保留）
    cmds:
      - docker compose down

  db-up:
    desc: 将全部库同步到最新 SQL 迁移（golang-migrate up，幂等）
    cmds:
      - go run ./pkg/db/cmd/migrate up

  db-status:
    desc: 查看各库当前迁移版本与「可修改 / 已应用锁定」的 SQL 文件
    cmds:
      - go run ./pkg/db/cmd/migrate status

  db-gen:
    desc: 同步迁移后用 gorm gen 生成模型与查询代码（pkg/db/model、pkg/db/query）
    cmds:
      - go run ./pkg/db/gen

  # ---- 数据集融合（datasets/，不入 git；细节见 datasets/README.md）----

  ds-check:
    desc: 数据集融合脚本自检（假数据 + mock 模型，秒级；含抽查回答解析契约测试）
    cmds:
      - python3 datasets/scripts/run.py --check

  ds-smoke:
    desc: 数据集融合真模型冒烟（小骨架 2 轮），验证 Ollama 链路/解析/落盘/续跑，ds-run 前必过
    cmds:
      - python3 datasets/scripts/run.py --smoke

  ds-run:
    desc: 数据集融合闭环：开始/续跑，分批执行（task ds-run ROUNDS=5 [-- --allow-script-change]）
    cmds:
      - python3 datasets/scripts/run.py --rounds {{.ROUNDS}} {{.CLI_ARGS}}

  ds-materialize:
    desc: 用最优参数物化全量候选记录集（processed/<版本>/candidates.jsonl，收敛后执行）
    cmds:
      - python3 datasets/scripts/run.py --materialize

  ds-status:
    desc: 查看数据集融合调参进度（累计轮数/当前参数/区间结论），不执行
    cmds:
      - python3 datasets/scripts/run.py --status

  ds-archive-v1:
    desc: v1 核心产物归档到 datasets/archive/v1/（一次性；之后 v2/v3 自动版本隔离）
    cmds:
      - python3 datasets/scripts/run.py --archive-v1 {{.CLI_ARGS}}

  ds-embed:
    desc: BM25 过滤 + Qwen3-Embedding + 精确 top-K（长任务，可中断续跑；小样验证 task ds-embed -- --limit 1000）
    cmds:
      - python3 datasets/scripts/embed.py --all {{.CLI_ARGS}}

  ds-embed-bm25:
    desc: 只过滤 T2Ranking BM25 到选中 query 的 top-K
    cmds:
      - python3 datasets/scripts/embed.py --bm25 {{.CLI_ARGS}}

  ds-embed-collection:
    desc: 只向量化 collection（可中断续跑）
    cmds:
      - python3 datasets/scripts/embed.py --collection {{.CLI_ARGS}}

  ds-embed-queries:
    desc: 只向量化选中 query
    cmds:
      - python3 datasets/scripts/embed.py --queries {{.CLI_ARGS}}

  ds-embed-search:
    desc: 只做向量精确 top-K 检索
    cmds:
      - python3 datasets/scripts/embed.py --search {{.CLI_ARGS}}

  ds-build-tuning:
    desc: 构建 neutral/joint 两层调参数据（processed/<版本>/tuning.jsonl）
    cmds:
      - python3 datasets/scripts/build_tuning.py {{.CLI_ARGS}}

  ds-tune:
    desc: 联合扫描召回参数（NDCG@10/Recall@20；task ds-tune -- --layer joint --max-queries 3000）
    cmds:
      - python3 datasets/scripts/tune.py {{.CLI_ARGS}}

  # ---- v3 融合（复用 v2 引擎；DS_CONFIG 指向 datasets/configs/v3/fusion.json）----

  ds-v3-check:
    desc: v3 融合脚本自检（假数据 + mock 模型，秒级）
    env:
      DS_CONFIG: datasets/configs/v3/fusion.json
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/run.py --check"

  ds-v3-smoke:
    desc: v3 融合真模型冒烟（小骨架 2 轮，验证 Ollama/解析/落盘/续跑）
    env:
      DS_CONFIG: datasets/configs/v3/fusion.json
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/run.py --smoke"

  ds-v3-run:
    desc: v3 融合闭环：开始/续跑（task ds-v3-run ROUNDS=10）
    env:
      DS_CONFIG: datasets/configs/v3/fusion.json
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/run.py --rounds {{.ROUNDS}} {{.CLI_ARGS}}"

  ds-v3-status:
    desc: 查看 v3 融合调参进度（不执行）
    env:
      DS_CONFIG: datasets/configs/v3/fusion.json
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/run.py --status"

  ds-v3-materialize:
    desc: 用 v3 最优参数物化 processed/v3/candidates.jsonl
    env:
      DS_CONFIG: datasets/configs/v3/fusion.json
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/run.py --materialize"

  ds-v3-embed:
    desc: v3 BM25 过滤 + 向量化 + 精确 top-K（长任务，可中断续跑）
    env:
      DS_CONFIG: datasets/configs/v3/fusion.json
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/embed.py --all {{.CLI_ARGS}}"

  ds-v3-embed-bm25:
    desc: v3 只过滤 T2Ranking BM25 到选中 query 的 top-K
    env:
      DS_CONFIG: datasets/configs/v3/fusion.json
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/embed.py --bm25 {{.CLI_ARGS}}"

  ds-v3-embed-collection:
    desc: v3 只向量化 collection（可中断续跑）
    env:
      DS_CONFIG: datasets/configs/v3/fusion.json
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/embed.py --collection {{.CLI_ARGS}}"

  ds-v3-embed-queries:
    desc: v3 只向量化选中 query
    env:
      DS_CONFIG: datasets/configs/v3/fusion.json
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/embed.py --queries {{.CLI_ARGS}}"

  ds-v3-embed-search:
    desc: v3 只做向量精确 top-K 检索
    env:
      DS_CONFIG: datasets/configs/v3/fusion.json
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/embed.py --search {{.CLI_ARGS}}"

  ds-v3-build-tuning:
    desc: 构建 v3 neutral/joint 两层调参数据（processed/v3/tuning.jsonl）
    env:
      DS_CONFIG: datasets/configs/v3/fusion.json
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/build_tuning.py {{.CLI_ARGS}}"

  ds-v3-tune:
    desc: v3 联合扫描召回参数（task ds-v3-tune -- --layer joint --max-queries 3000）
    env:
      DS_CONFIG: datasets/configs/v3/fusion.json
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/tune.py {{.CLI_ARGS}}"
