version: '3'

# GanRAG 根 Taskfile：统一编排各服务的编译、镜像构建与容器运行
#
# 常用命令：
#   task proto                     生成所有服务的 Proto Go 代码
#   task build                     编译所有已实现服务
#   task build -- vector-store     只编译指定服务
#   task build-image               构建所有已实现服务的镜像
#   task run                       后台启动所有已实现服务
#   task run -- vector-store       前台启动指定服务
#   task stop                      停止所有服务容器
#   task ds-check VERSION=v3       数据集融合脚本自检（VERSION 默认 v3；v2 用 VERSION=v2）
#   task ds-smoke VERSION=v3       数据集融合真模型冒烟（ds-run 前必过）
#   task ds-run VERSION=v2         数据集融合闭环：开始/续跑（ROUNDS=10 分批）
#   task ds-status VERSION=v3      查看数据集融合调参进度
#   task ds-archive-v1             v1 核心产物归档（一次性；之后版本自动隔离）
#   task ds-embed VERSION=v3       BM25 + 向量 + 精确 top-K（长任务，可分批/续跑）
#   task ds-build-tuning VERSION=v3 构建 neutral/joint 调参数据
#   task ds-tune VERSION=v3        联合扫描召回参数（NDCG@10 / Recall@20）
#   task ds-exp EID=E01 VERSION=v3 单个实验（-- --smoke 快速验证）
#   task ds-exp-all EIDS="E01 E05" 批量实验

# 服务列表：自动发现 service/<name>/Taskfile.yml 并按名称排序
vars:
  SERVICES:
    sh: find service -mindepth 2 -maxdepth 2 -name Taskfile.yml -exec dirname {} \; | xargs -n1 basename | sort
  # 数据集版本：v3（默认）走 datasets/configs/v3/fusion.json；v1/v2 走 datasets/configs/fusion.json。
  # 自定义配置用 task ds-... CONFIG=path/to/fusion.json 覆盖。
  VERSION: "v3"
  CONFIG: ""
  DS_CONFIG:
    sh: |
      if [ -n "{{.CONFIG}}" ]; then echo "{{.CONFIG}}";
      elif [ "{{.VERSION}}" = "v3" ]; then echo "datasets/configs/v3/fusion.json";
      elif [ "{{.VERSION}}" = "v1" ] || [ "{{.VERSION}}" = "v2" ]; then echo "datasets/configs/fusion.json";
      else echo "datasets/configs/{{.VERSION}}/fusion.json"; fi
  # 数据集脚本统一使用该 venv（已装 numpy；v2/v3 共用）
  DS_PYTHON: "datasets/.venv/bin/python"
  # 每批次轮数与小 L2 query 数
  ROUNDS: "10"
  L2_QUERIES: "200"
  # 实验入口
  EID: "E01"
  EIDS: "E01 E02A E02B E03A E03B E04 E05 E06 E07 E08 E09 E10"

tasks:
  default:
    desc: 列出所有可用任务
    cmds:
      - task --list

  proto:
    desc: 生成所有服务的 Proto Go 代码（api/gen）
    cmds:
      - ./scripts/gen-proto.sh

  build:
    desc: 编译服务（全部；指定单个：task build -- vector-store）
    cmds:
      - cmd: |
          set -e
          if [ -n "{{.CLI_ARGS}}" ]; then
            set -- {{.CLI_ARGS}}
            task -d "service/$1" build
            exit 0
          fi
          for tf in service/*/Taskfile.yml; do
            [ -e "$tf" ] || continue
            svc="$(basename "$(dirname "$tf")")"
            echo "==> build ${svc}"
            task -d "service/${svc}" build
          done

  build-image:
    desc: 构建服务镜像（全部；指定单个：task build-image -- vector-store）
    cmds:
      - cmd: |
          set -e
          if [ -n "{{.CLI_ARGS}}" ]; then
            set -- {{.CLI_ARGS}}
            task -d "service/$1" build-image
            exit 0
          fi
          for tf in service/*/Taskfile.yml; do
            [ -e "$tf" ] || continue
            svc="$(basename "$(dirname "$tf")")"
            echo "==> build-image ${svc}"
            task -d "service/${svc}" build-image
          done

  run:
    desc: 启动服务（全部后台运行；指定单个：task run -- vector-store [--detach]）
    cmds:
      - cmd: |
          set -e
          if [ -n "{{.CLI_ARGS}}" ]; then
            set -- {{.CLI_ARGS}}
            svc="$1"
            shift
            task -d "service/${svc}" run -- "$@"
            exit 0
          fi
          for tf in service/*/Taskfile.yml; do
            [ -e "$tf" ] || continue
            svc="$(basename "$(dirname "$tf")")"
            echo "==> run ${svc}"
            task -d "service/${svc}" run -- --detach
          done
          echo "全部已实现服务已后台启动（日志：docker logs -f ganrag-<服务名>；停止：task stop）"

  stop:
    desc: 停止并删除所有服务容器
    cmds:
      - for: { var: SERVICES }
        cmd: task -d "service/{{.ITEM}}" stop

  infra:
    desc: 启动共享基础设施（MySQL、Garage；数据卷持久化）
    cmds:
      # ganrag 网络为外部共享（compose 与各服务 run.sh 共用），不存在时先创建
      - docker network inspect ganrag >/dev/null 2>&1 || docker network create ganrag
      - docker compose up -d

  infra-down:
    desc: 停止共享基础设施（数据卷保留）
    cmds:
      - docker compose down

  db-up:
    desc: 将全部库同步到最新 SQL 迁移（golang-migrate up，幂等）
    cmds:
      - go run ./pkg/db/cmd/migrate up

  db-status:
    desc: 查看各库当前迁移版本与「可修改 / 已应用锁定」的 SQL 文件
    cmds:
      - go run ./pkg/db/cmd/migrate status

  db-gen:
    desc: 同步迁移后用 gorm gen 生成模型与查询代码（pkg/db/model、pkg/db/query）
    cmds:
      - go run ./pkg/db/gen

  # ---- 数据集融合 / 实验（统一用 VERSION 选配置与产物版本）----
  #
  # VERSION=v3（默认）→ datasets/configs/v3/fusion.json，产物 processed/v3/...
  # VERSION=v2        → datasets/configs/fusion.json，产物 processed/v2/...
  # 自定义配置：task ds-check CONFIG=path/to/fusion.json

  ds-check:
    desc: 融合脚本自检（VERSION=v3 默认；v2：task ds-check VERSION=v2）
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/run.py --check"

  ds-smoke:
    desc: 融合真模型冒烟（VERSION=v3 默认；ds-run 前必过）
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/run.py --smoke"

  ds-run:
    desc: 融合闭环：开始/续跑（task ds-run VERSION=v2 ROUNDS=5；v3-full 用 ds-materialize）
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/run.py --rounds {{.ROUNDS}} {{.CLI_ARGS}}"

  ds-status:
    desc: 查看融合调参进度（VERSION=v3 默认）
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/run.py --status"

  ds-archive-v1:
    desc: v1 核心产物归档到 datasets/archive/v1/（一次性）
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/run.py --archive-v1 {{.CLI_ARGS}}"

  ds-materialize:
    desc: 物化全量候选集（VERSION 决定 processed/<版本>/candidates.jsonl）
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/run.py --materialize"

  ds-materialize-l2:
    desc: 物化小 L2（VERSION=v3 默认；L2_QUERIES=200）
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/run.py --materialize --limit-queries {{.L2_QUERIES}} --out datasets/processed/{{.VERSION}}/l2/candidates.jsonl"

  ds-accept-l2:
    desc: 小 L2 验收（Schema/split/VIF/锚点 → processed/<版本>/acceptance）
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/l2_accept.py --input datasets/processed/{{.VERSION}}/l2/candidates.jsonl --out datasets/processed/{{.VERSION}}/acceptance --all"

  ds-embed:
    desc: BM25 + 向量 + 精确 top-K（长任务；VERSION=v3 默认）
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/embed.py --all {{.CLI_ARGS}}"

  ds-embed-bm25:
    desc: 只过滤 T2Ranking BM25 到选中 query 的 top-K
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/embed.py --bm25 {{.CLI_ARGS}}"

  ds-embed-collection:
    desc: 只向量化 collection（可中断续跑）
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/embed.py --collection {{.CLI_ARGS}}"

  ds-embed-queries:
    desc: 只向量化选中 query
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/embed.py --queries {{.CLI_ARGS}}"

  ds-embed-search:
    desc: 只做向量精确 top-K 检索
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/embed.py --search {{.CLI_ARGS}}"

  ds-build-tuning:
    desc: 构建 neutral/joint 两层调参数据（VERSION=v3 默认）
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/build_tuning.py {{.CLI_ARGS}}"

  ds-tune:
    desc: 联合扫描召回参数（task ds-tune VERSION=v3 -- --layer joint --max-queries 3000）
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
    cmds:
      - "{{.DS_PYTHON}} datasets/scripts/tune.py {{.CLI_ARGS}}"

  # ---- 实验（E01–E10）----

  ds-exp-check:
    desc: 实验脚本自检（合成小数据，秒级）
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
      PYTHONPATH: datasets/scripts
    cmds:
      - "{{.DS_PYTHON}} -m experiments --self-test"

  ds-exp:
    desc: 单个实验（task ds-exp EID=E01 VERSION=v3 -- --smoke；EID 大小写不敏感；E01–E10 目前只支持 v3）
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
      PYTHONPATH: datasets/scripts
    cmds:
      - "{{.DS_PYTHON}} -m experiments {{.EID}} {{.CLI_ARGS}}"

  ds-exp-all:
    desc: 批量实验（task ds-exp-all EIDS="E01 E05" VERSION=v3 -- --smoke；E01–E10 目前只支持 v3）
    env:
      DS_CONFIG: "{{.DS_CONFIG}}"
      PYTHONPATH: datasets/scripts
    cmds:
      - |
        set -e
        for eid in {{.EIDS}}; do
          echo "==> experiment ${eid}"
          "{{.DS_PYTHON}}" -m experiments "$eid" {{.CLI_ARGS}}
        done
