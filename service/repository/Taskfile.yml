version: '3'

# Repository 服务级任务（阶段一已实现：知识库 + 整段上传）
#
# 服务入口：cmd/server；容器端口 50052。

vars:
  SERVICE: repository
  TAG: '{{.TAG | default "latest"}}'
  OS: '{{.OS | default "linux"}}'
  ARCH: '{{.ARCH | default "amd64"}}'
  PORT: '50052'           # 宿主机映射端口（gRPC 调试）
  CONTAINER_PORT: '50052' # 容器内监听端口
  COPY_CONFIG: '{{.COPY_CONFIG | default "true"}}'

tasks:
  build:
    desc: 编译二进制到 service/repository/bin/server-<os>-<arch>
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - ./scripts/build.sh --os {{.OS}} --arch {{.ARCH}}

  build-image:
    desc: 构建 Docker 镜像 ganrag/repository:<tag>（依赖 build）
    dir: '{{.TASKFILE_DIR}}'
    deps: [build]
    cmds:
      - ./scripts/build-image.sh --tag {{.TAG}} --os {{.OS}} --arch {{.ARCH}} --copy-config {{.COPY_CONFIG}}

  run:
    desc: 启动容器（默认前台；CLI 可追加 --detach / --mount-config）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - ./scripts/run.sh --tag {{.TAG}} {{if .PORT}}--port {{.PORT}} --container-port {{.CONTAINER_PORT}}{{end}} {{.CLI_ARGS}}

  stop:
    desc: 停止并删除容器 ganrag-repository
    cmds:
      - docker rm -f ganrag-{{.SERVICE}} >/dev/null 2>&1 || true
