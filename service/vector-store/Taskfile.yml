version: '3'

# Vector Store 服务级任务：编译、构建镜像、容器运行
#
# 具体实现位于本服务 scripts/ 目录（各服务独立维护）
#
# 常用命令：
#   task build                     编译（默认 linux/amd64）
#   task build OS=windows ARCH=amd64  编译指定平台
#   task build-image               构建镜像（自动先编译；COPY_CONFIG=false 可不复制配置）
#   task run                       前台启动容器
#   task run -- --detach           后台启动容器
#   task run -- --detach --mount-config  后台启动并使用宿主机 configs/config.yaml
#   task stop                      停止并删除容器

vars:
  SERVICE: vector-store
  TAG: '{{.TAG | default "latest"}}'
  OS: '{{.OS | default "linux"}}'
  ARCH: '{{.ARCH | default "amd64"}}'
  PORT: '{{.PORT | default "50053"}}'                     # 宿主机映射端口
  CONTAINER_PORT: '{{.CONTAINER_PORT | default "50053"}}' # 容器内监听端口
  COPY_CONFIG: '{{.COPY_CONFIG | default "true"}}'        # 是否把 configs 复制进镜像

tasks:
  build:
    desc: 编译二进制到 service/vector-store/bin/server-<os>-<arch>
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - ./scripts/build.sh --os {{.OS}} --arch {{.ARCH}}

  build-image:
    desc: 构建 Docker 镜像 ganrag/vector-store:<tag>（依赖 build）
    dir: '{{.TASKFILE_DIR}}'
    deps: [build]
    cmds:
      - ./scripts/build-image.sh --tag {{.TAG}} --os {{.OS}} --arch {{.ARCH}} --copy-config {{.COPY_CONFIG}}

  run:
    desc: 启动容器（默认前台；CLI 可追加 --detach / --mount-config）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - ./scripts/run.sh --tag {{.TAG}} {{if .PORT}}--port {{.PORT}} --container-port {{.CONTAINER_PORT}}{{end}} {{.CLI_ARGS}}

  stop:
    desc: 停止并删除容器 ganrag-vector-store
    cmds:
      - docker rm -f ganrag-{{.SERVICE}} >/dev/null 2>&1 || true
