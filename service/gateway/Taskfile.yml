version: '3'

# Gateway 服务级任务
#
# 服务端口：宿主 8080 → 容器 8080（架构文档端口规划）

vars:
  SERVICE: gateway
  TAG: '{{.TAG | default "latest"}}'
  OS: '{{.OS | default "linux"}}'
  ARCH: '{{.ARCH | default "amd64"}}'
  PORT: '8080'           # 宿主机映射端口
  CONTAINER_PORT: '8080' # 容器内监听端口
  COPY_CONFIG: '{{.COPY_CONFIG | default "true"}}'

tasks:
  build:
    desc: 编译二进制到 service/gateway/bin/server-<os>-<arch>
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - ./scripts/build.sh --os {{.OS}} --arch {{.ARCH}}

  build-image:
    desc: 构建 Docker 镜像 ganrag/gateway:<tag>（依赖 build）
    dir: '{{.TASKFILE_DIR}}'
    deps: [build]
    cmds:
      - ./scripts/build-image.sh --tag {{.TAG}} --os {{.OS}} --arch {{.ARCH}} --copy-config {{.COPY_CONFIG}}

  run:
    desc: 启动容器（默认前台；CLI 可追加 --detach / --mount-config）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - ./scripts/run.sh --tag {{.TAG}} {{if .PORT}}--port {{.PORT}} --container-port {{.CONTAINER_PORT}}{{end}} {{.CLI_ARGS}}

  stop:
    desc: 停止并删除容器 ganrag-gateway
    cmds:
      - docker rm -f ganrag-{{.SERVICE}} >/dev/null 2>&1 || true
